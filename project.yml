name: TabRecordApp

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
  SpeakerKit:
    url: https://github.com/argmaxinc/SpeakerKit
    from: 0.1.0

options:
  bundleIdPrefix: com.tabrecord
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  TabRecordApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TabRecordApp
    settings:
      base:
        PRODUCT_NAME: TabRecord
        PRODUCT_MODULE_NAME: TabRecordApp
        PRODUCT_BUNDLE_IDENTIFIER: com.tabrecord.app
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: TabRecordApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: TabRecordApp/TabRecord.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: AVFoundation.framework
      - sdk: AppKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreAudio.framework
      - sdk: UserNotifications.framework
      - package: WhisperKit
        product: WhisperKit
      - package: SpeakerKit
        product: SpeakerKit

  TabRecordAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TabRecordAppTests
    dependencies:
      - target: TabRecordApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TabRecord.app/Contents/MacOS/TabRecord"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TabRecordApp:
    build:
      targets:
        TabRecordApp: all
        TabRecordAppTests: [test]
    test:
      targets:
        - TabRecordAppTests
