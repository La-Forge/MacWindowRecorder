name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: |
          xcodebuild \
            -project TabRecordApp.xcodeproj \
            -resolvePackageDependencies \
            -quiet

      - name: Build release app
        run: |
          xcodebuild \
            -project TabRecordApp.xcodeproj \
            -scheme TabRecordApp \
            -configuration Release \
            -derivedDataPath .build \
            -quiet

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH=".build/Build/Products/Release/TabRecord.app"
          DMG_NAME="TabRecord.dmg"
          STAGING_DIR="$(mktemp -d)/dmg-staging"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "TabRecord ${VERSION}" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TabRecord ${{ github.ref_name }}"
          generate_release_notes: true
          files: TabRecord.dmg
